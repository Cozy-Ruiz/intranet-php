replicaCount: 1

appEnv: "DEV"

image:
  tag: "1.8"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    - secretName: escalante-wildcard-tls
      hosts:
        - intranet-php-dev.escalante.com.mx
  host: intranet-php-dev.escalante.com.mx

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

monitoring:
  enabled: true
