replicaCount: 1

image:
  repository: cozyruiz/intranet-php
  tag: "1.3"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

monitoring:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    - secretName: escalante-wildcard-tls
      hosts:
        - intranet-php-dev.escalante.com.mx
  host: intranet-php-dev.escalante.com.mx
