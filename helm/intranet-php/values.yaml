replicaCount: 1

image:
  repository: cozyruiz/intranet-php
  tag: "1.3"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

sharedStorage:
  - name: fotos
    path: /var/www/html/FILES
  - name: comunicacion-interna
    path: /var/www/html/ComunicacionInterna/Personal/FILES
  - name: expedientes
    path: /var/www/html/ComunicacionInterna/Personal/FILES
  - name: carta_compromiso
    path: /var/www/html/ComunicacionInterna/Personal/CartaCompromisoSGI
  - name: perfiles_puestos
    path: /var/www/html/ComunicacionInterna/Personal/perfiles_puestos

monitoring:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    - secretName: escalante-wildcard-tls
      hosts:
        - intranet-php-dev.escalante.com.mx
  host: intranet-php-dev.escalante.com.mx
